services:
  image-compressor:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-compressor:latest
    container_name: image-compressor
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
